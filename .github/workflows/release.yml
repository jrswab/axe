# .github/workflows/release.yml
# Create binaries on each release
name: goreleaser

on:
  push:
    tags:
      - 'v*' # only version tags trigger a run

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag and changelog
        env:
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          .agents/scripts/release-check admit --tag "$TAG" --ref "$REF" --sha "$SHA" --notes "$RUNNER_TEMP/release-notes.md"

  validation:
    needs: [admission]
    uses: ./.github/workflows/go.yml
    permissions:
      contents: read

  goreleaser:
    needs: [validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck tag and changelog
        env:
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          .agents/scripts/release-check admit --tag "$TAG" --ref "$REF" --sha "$SHA" --notes "$RUNNER_TEMP/release-notes.md"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.12.7"
          install-only: true
      - name: Check GoReleaser config
        run: goreleaser check
      - name: Build release packages without publishing
        run: goreleaser release --clean --skip=publish --release-notes="$RUNNER_TEMP/release-notes.md"
      - name: Check release packages
        env:
          TAG: ${{ github.ref_name }}
        run: .agents/scripts/release-check artifacts --tag "$TAG" --dist dist
      - name: Publish release
        run: goreleaser release --clean --release-notes="$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      packages: write      # push to GHCR
      attestations: write  # build provenance attestation
      id-token: write      # OIDC token for attestation signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
